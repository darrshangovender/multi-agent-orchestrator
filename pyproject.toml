[project]
name = "multi-agent-orchestrator"
version = "0.1.0"
description = "Production-grade multi-agent system with structured handoffs, workspace memory, tool registration, and full trace observability."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Darrshan Govender", email = "darrshangovender@gmail.com" }]
keywords = ["llm", "agents", "multi-agent", "orchestration", "agentic"]
dependencies = [
    "pydantic>=2.7",
    "rich>=13.7",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
openai = ["openai>=1.50.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/darrshangovender/multi-agent-orchestrator"
Issues = "https://github.com/darrshangovender/multi-agent-orchestrator/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The distribution name ("multi-agent-orchestrator") does not match the import
# package directory ("orchestrator/"), so hatchling cannot infer what to ship.
# Without this it aborts the build with "Unable to determine which files to
# ship", which breaks `pip install -e .` in CI.
[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
